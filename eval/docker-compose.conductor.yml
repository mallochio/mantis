# Docker Compose override to mount the retrained Conductor checkpoint
# into the openfugu container at /app/checkpoint.
# Used by eval/run_all.sh for the conductor-new config.
services:
  openfugu:
    environment:
      FUGU_LOCAL_CONDUCTOR: /app/checkpoint
      FUGU_CONDUCTOR_MODEL: gpt-5.6-luna-max
      FUGU_CONDUCTOR_DTYPE: float32
      FUGU_CONDUCTOR_MAX_NEW: 128
    volumes:
      - ./outputs/conductor_retrain/retrain-conductor-20260802_003213/checkpoint:/app/checkpoint:ro
