name: Router evaluation (manual)

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Measured cumulative budget ceiling in USD"
        required: true
        default: "250"
      dry_run:
        description: "Only resolve the manifest and print projected spend"
        required: true
        type: boolean
        default: true

jobs:
  router-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Safe dry-run projection
        if: inputs.dry_run
        run: uv run python eval/router_eval.py --budget-usd "${{ inputs.budget_usd }}" --dry-run
      - name: Install pi
        if: ${{ !inputs.dry_run }}
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Validate evaluation prerequisites
        if: ${{ !inputs.dry_run }}
        run: |
          test -n "${LITELLM_API_KEY:-}" || (echo "LITELLM_API_KEY is required" && exit 1)
          test -n "${MANTIS_API_KEY:-}" || (echo "MANTIS_API_KEY is required" && exit 1)
          command -v docker
          docker info
          command -v pi
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MANTIS_API_KEY: ${{ secrets.MANTIS_API_KEY }}
      - name: Explicit evaluation run
        if: ${{ !inputs.dry_run }}
        run: uv run python eval/router_eval.py --budget-usd "${{ inputs.budget_usd }}"
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MANTIS_API_KEY: ${{ secrets.MANTIS_API_KEY }}
      - name: Upload evaluation results
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: router-evaluation-results
          path: eval/runs/router-results.jsonl
          if-no-files-found: warn
