name: CI

# Deliberately main-only; stacked PRs may have no checks until the base lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy apps/api scripts --exclude outputs

      - name: Run Mantis tests
        run: uv run pytest tests -q
      - name: Report Mantis coverage
        run: uv run coverage report --fail-under=90
