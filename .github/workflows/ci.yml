name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,train,serve,eval]

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy openfugu-patch scripts --exclude outputs

      - name: Run tests
        run: pytest tests -q
