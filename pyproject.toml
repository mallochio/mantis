[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.2.0"
description = "Local Mantis orchestration stack routed through OpenRouter"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "transformers>=4.52,<5",
    "requests>=2.25",
    "pyyaml>=6",
    "tqdm>=4.66",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "accelerate>=0.30",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
train = [
    "trl>=0.19,<0.20",
    "datasets>=3.6",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "math-verify>=0.9",
    "cma>=4.0",
    "mergekit>=0.1",
    "llm-blender>=0.0.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "boto3>=1.28",
]
eval = [
    "requests>=2.25",
    "pyyaml>=6",
]
dev = [
    "openai>=1.60,<3",
    "ruff>=0.5",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "OpenFugu",
    "__pycache__",
    ".git",
    "*.egg-info",
    "build",
    "dist",
    ".env*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # simplify
    "FURB",# refurb
    "BLE", # blind except
    "S",   # bandit (security)
    "TRY", # try/except style
    "PERF",# performance
]
ignore = [
    "S101",  # assert in tests
    "S311",  # random pseudo-crypto
    "S603",  # subprocess without shell
    "S607",  # start process with partial path
    "TRY003",# long messages outside exception class
    "EM101", # raw string in exception
    "EM102", # f-string in exception
]

[tool.ruff.lint.per-file-ignores]
"openfugu-patch/serve.py" = ["E402"]
"scripts/retrain_router_pool.py" = ["E402"]
"scripts/learn_router.py" = ["E402"]
"scripts/retrain_conductor.py" = ["E402", "I001"]
"scripts/update_pool.py" = ["S310"]
"tests/test_serve.py" = ["E501", "S310"]
"openfugu-patch/api.py" = ["E501"]
"tests/test_retrain_router_pool.py" = ["E501"]
"tests/test_retrain_conductor.py" = ["S105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
exclude = [
    "OpenFugu",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "openfugu-patch", "OpenFugu/openfugu", "OpenFugu"]
addopts = "--cov=scripts --cov=openfugu-patch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["scripts", "openfugu-patch"]
omit = [
    "*/tests/*",
    "OpenFugu/*",
    "scripts/make_vec.py",
    "scripts/retrain_conductor.py",
    "scripts/sky_launch_retrain_router.sh",
    "scripts/verify.sh",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
