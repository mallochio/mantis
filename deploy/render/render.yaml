services:
  - type: web
    name: mantis-orchestrator
    runtime: docker
    plan: pro
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: MANTIS_API_KEY
        generateValue: true
      - key: MANTIS_ROUTER_KEY
        generateValue: true
      - key: BIFROST_API_KEY
        generateValue: true
      - key: BIFROST_ENCRYPTION_KEY
        generateValue: true
      # Dashboard Basic Auth — intentionally separate from the virtual-key secret.
      - key: BIFROST_ADMIN_USERNAME
        value: admin
      - key: BIFROST_ADMIN_PASSWORD
        generateValue: true
      - key: BIFROST_COMPLEXITY_PILOT_KEY
        generateValue: true
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TAILSCALE_AUTHKEY
        sync: false
      - key: TAILSCALE_HOSTNAME
        value: mantis-render
      - key: AZURE_OPENAI_RESOURCE_URL
        value: https://<your-resource-name>.openai.azure.com
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BEDROCK_REGION
        value: eu-central-1
      - key: VERTEXAI_PROJECT
        value: <your-gcp-project-id>
      - key: VERTEXAI_LOCATION
        value: global
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: MODAL_PROXY_TOKEN
        sync: false
