model_list:
  # Default llm-router cheap/expensive targets — all routed through OpenRouter
  - model_name: expensive
    litellm_params:
      model: openai/anthropic/claude-opus-4.8
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: cheap
    litellm_params:
      model: openai/anthropic/claude-sonnet-5
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # 7-slot fugu worker pool. All are on the code/cost Pareto frontier and are
  # available on AWS Bedrock, GCP, and Azure through OpenRouter.
  - model_name: claude-haiku-4.5
    litellm_params:
      model: openai/anthropic/claude-haiku-4.5
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
