# Zen-only SWE-rebench Phase 2 fixed-arm tier selection (per-arm shard).
#
# One cluster per model arm; all shards share a RUN_ID and fan in to
# gs://ih-storage-sid/<RUN_ID>/<ARM>/results.jsonl. No workdir, no storage
# mounts: SkyPilot rsyncs local file_mounts to the VM, so no GCS bucket is
# created. Launch with:
#   sky launch -y -d --cluster zen-phase2-<ARM> launch/sky/zen-swe-rebench-phase2.yaml #     --env ARM=<ARM> --env RUN_ID=<RUN_ID> #     --env OPENCODE_API_KEY=... --env BIFROST_API_KEY=... --env BIFROST_ENCRYPTION_KEY=...

name: zen-swe-rebench-phase2

resources:
  cloud: gcp
  region: europe-west4
  cpus: 4
  memory: 16+
  disk_size: 120
  use_spot: true

file_mounts:
  /opt/mantis-eval/scripts/zen_swe_rebench_arm.sh: scripts/zen_swe_rebench_arm.sh
  /opt/mantis-eval/eval/router_eval.py: eval/router_eval.py
  /opt/mantis-eval/eval/model_prices.json: eval/model_prices.json
  /opt/mantis-eval/eval/prices/zen-2026-08-13.json: eval/prices/zen-2026-08-13.json
  /opt/mantis-eval/eval/router_manifest.json: eval/router_manifest.json

setup: |
  set -euxo pipefail
  export DEBIAN_FRONTEND=noninteractive
  sudo apt-get update -y
  sudo apt-get install -y --no-install-recommends git curl ca-certificates gnupg openssl python3 python3-pip python3-requests
  if ! command -v docker >/dev/null 2>&1; then
    curl -fsSL https://get.docker.com | sudo sh
    (sudo systemctl enable --now docker || (sudo nohup dockerd >/var/log/dockerd.log 2>&1 &)) || true
  fi
  if ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 22 ]; then
    curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
    sudo apt-get install -y nodejs
  fi
  sudo npm install -g @earendil-works/pi-coding-agent@0.84.1
  echo "node=$(node --version) pi=$(pi --version) docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo n/a)"

run: |
  set -euo pipefail
  bash /opt/mantis-eval/scripts/zen_swe_rebench_arm.sh
