name: retrain-fugu-conductor-real-3b-smoke-gcp

resources:
  # One-step acceptance test for di-zhang-fdu/openfugu-conductor-3b on GCP.
  # L4 (24 GB) is sufficient for a single 3B GRPO step with 2 generations.
  # Try spot first (cheaper); if unavailable, relaunch with --no-use-spot.
  cloud: gcp
  region: us-central1
  accelerators: L4:1
  memory: 32+
  use_spot: true

workdir: .

envs:
  # Pool must be exactly 7 model specs in the same format as retrain_router_pool.py.
  RETRAIN_WORKER_MODELS: "google/gemini-3.6-flash|high,openai/gpt-5.6-luna|max,openai/gpt-5.6-sol|medium,deepseek/deepseek-v4-flash-0731|xhigh,anthropic/claude-opus-5|medium,anthropic/claude-sonnet-5|medium,google/gemini-3.1-pro-preview|high"
  # Dataset can be any source supported by retrain_conductor.py.
  RETRAIN_DATASET: "s3://external-datasets-archive/terminal-bench-2.1/"
  # Real Conductor checkpoint.
  FUGU_BASE_MODEL: "di-zhang-fdu/openfugu-conductor-3b"
  # One-step smoke: 1 task, 1 optimizer step, GRPO group of 2.
  RETRAIN_STEPS: "1"
  RETRAIN_LIMIT: "1"
  RETRAIN_NUM_GENERATIONS: "2"
  RETRAIN_PER_DEVICE_BATCH: "2"
  RETRAIN_MAX_PROMPT_LENGTH: "512"
  RETRAIN_MAX_COMPLETION_LENGTH: "128"
  RETRAIN_TEMPERATURE: "0.7"
  # Use 8-bit AdamW to fit a 3B GRPO step on a 24 GB L4/A10G.
  RETRAIN_OPTIM: "adamw_bnb_8bit"
  # Short worker calls keep cost bounded for a single-step rollout.
  FUGU_WORKER_TIMEOUT: "30"
  FUGU_WORKER_MAX_TOKENS: "256"
  # Use live OpenRouterWorker rollouts so the acceptance test exercises the
  # full reward path. Set to 1 only for a zero-cost checkpoint-only smoke.
  FUGU_CONDUCTOR_MOCK_WORKER: "0"
  OUTPUT_ROOT: "/tmp/fugu-outputs/retrain-fugu-conductor"

setup: |
  set -euo pipefail
  # Install CUDA-enabled torch first so OpenFugu requirements don't pull CPU torch.
  pip install --quiet torch==2.4.1 --extra-index-url https://download.pytorch.org/whl/cu121
  pip install --quiet -r requirements-conductor.txt
  # OpenFugu is a pinned upstream submodule; fetch it if SkyPilot did not sync it.
  bash scripts/fetch_openfugu.sh
  mkdir -p "$OUTPUT_ROOT"

run: |
  set -euo pipefail
  if [ -z "${OPENROUTER_API_KEY:-}" ]; then
    echo "ERROR: pass --env OPENROUTER_API_KEY=... to sky launch" >&2
    exit 1
  fi
  if [ -z "${HF_TOKEN:-}" ]; then
    echo "WARN: HF_TOKEN not set; HuggingFace downloads may be rate-limited" >&2
  fi
  # Ensure 8-bit optimizer is available on the worker (idempotent, fast).
  pip install --quiet bitsandbytes
  # Ensure OpenFugu is present even if setup was skipped on cluster reuse.
  bash scripts/fetch_openfugu.sh

  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
  RUN_ID="retrain-conductor-real-3b-smoke-gcp-${TIMESTAMP}"
  export RETRAIN_OUTPUT_DIR="${OUTPUT_ROOT}/${RUN_ID}"
  export RETRAIN_RUN_ID="${RUN_ID}"
  mkdir -p "$RETRAIN_OUTPUT_DIR"

  python3 scripts/retrain_conductor.py \
    --pool "$RETRAIN_WORKER_MODELS" \
    --dataset "$RETRAIN_DATASET" \
    --base "$FUGU_BASE_MODEL" \
    --real-checkpoint-smoke \
    --output-dir "$RETRAIN_OUTPUT_DIR" \
    --run-id "$RUN_ID"

  echo "=== manifest.json ==="
  cat "${RETRAIN_OUTPUT_DIR}/manifest.json"

  echo "Real-3B Conductor acceptance smoke (GCP) complete. Outputs in $RETRAIN_OUTPUT_DIR"
  ls -la "$RETRAIN_OUTPUT_DIR"
