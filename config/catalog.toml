version = 1

[providers.openrouter]
adapter = "openrouter"
base_url = "https://openrouter.ai/api/v1"
credential_env = "OPENROUTER_API_KEY"
protocols = ["chat_completions", "responses"]

[providers.opencode-go]
adapter = "opencode-go"
base_url = "https://opencode.ai/zen/go/v1"
credential_env = "OPENCODE_API_KEY"
protocols = ["chat_completions"]

[base]
# Switchyard stage-router for mantis/base
# Swap efficient/capable models or their providers here; launch regenerates routes.toml.
revision = "direct-2026-08-30-litellm"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[base.targets.efficient]
provider = "openrouter"
reasoning_effort = "max"
max_tokens = 128000
upstream_model = "openai/gpt-5.6-luna"

[base.targets.capable]
provider = "openrouter"
reasoning_effort = "medium"
max_tokens = 128000
upstream_model = "openai/gpt-5.6-sol"

[mantis]
slot_order = [
    "gemini-3_6-flash",
    "gpt-5_6-luna",
    "gpt-5_6-sol",
    "deepseek-v4-flash",
    "claude-opus-5",
    "claude-sonnet-5",
    "gemini-3_1-pro-preview",
]
conductor = "gpt-5_6-luna"
conductor_model = "openrouter/openai/gpt-5.6-luna"
trained_slot_contract = "52eac89b5e96f1bf64b2bd83af4d8fbc649ddaaf162f4cabf9504aa93b6ae4cf"

[mantis.workers.gemini-3_6-flash]
provider = "openrouter"
# gemini-3.7-flash via openrouter
max_tokens = 65536
upstream_model = "google/gemini-3.7-flash"
model_identity = "gemini-3.6-flash"
reasoning_effort = "high"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-luna]
provider = "openrouter"
# gpt-5.6-luna via openrouter
max_tokens = 128000
upstream_model = "openai/gpt-5.6-luna"
model_identity = "gpt-5.6-luna"
reasoning_effort = "xhigh"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-sol]
provider = "openrouter"
# gpt-5.6-sol via openrouter
max_tokens = 128000
upstream_model = "openai/gpt-5.6-sol"
model_identity = "gpt-5.6-sol"
reasoning_effort = "medium"
protocols = ["chat_completions"]

[mantis.workers.deepseek-v4-flash]
provider = "opencode-go"
# deepseek-v4-flash via opencode subscription
max_tokens = 384000
upstream_model = "deepseek-v4-flash"
model_identity = "deepseek-v4-flash"
protocols = ["chat_completions"]

[mantis.workers.claude-opus-5]
provider = "openrouter"
# claude-opus-5 via openrouter (previously bedrock anthropic)
max_tokens = 128000
upstream_model = "anthropic/claude-opus-5"
model_identity = "claude-opus-5"
reasoning_effort = "medium"
protocols = ["chat_completions"]

[mantis.workers.claude-sonnet-5]
provider = "openrouter"
# claude-sonnet-5 via openrouter
max_tokens = 128000
upstream_model = "anthropic/claude-sonnet-5"
model_identity = "claude-sonnet-5"
reasoning_effort = "medium"
protocols = ["chat_completions"]

[mantis.workers.gemini-3_1-pro-preview]
provider = "openrouter"
# gemini-3.1-pro-preview via openrouter
max_tokens = 65536
upstream_model = "google/gemini-3.1-pro-preview"
model_identity = "gemini-3.1-pro-preview"
reasoning_effort = "high"
protocols = ["chat_completions"]

[fusion]
# demo mix: main via openrouter, sidekick pools opencode-go then openrouter
main = "gpt-5_6-sol"
sidekick = ["deepseek-v4-flash", "gpt-5_6-luna"]
fallback_on_escalate = true
max_follow_ups = 2
sidekick_max_tool_rounds = 16
main_tools = "none"
context_token_limit = 262144
max_output_tokens = 4096
