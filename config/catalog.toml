version = 1

[providers.bifrost]
adapter = "openai-compatible"
base_url = "http://127.0.0.1:8080/v1"
credential_env = "BIFROST_API_KEY"
developer_role = "system"
protocols = ["chat_completions", "responses"]

[providers.bifrost-anthropic]
adapter = "anthropic"
base_url = "http://127.0.0.1:8080/anthropic"
credential_env = "BIFROST_API_KEY"
protocols = ["anthropic_messages"]

[routellm]
active_policy = "coding"
revision = "bifrost-2026-08-13-model-swap"

[routellm.targets.cheap]
provider = "bifrost"
# deepseek-v4-pro (Bifrost OpenCode Go route): models.dev output cap 384000.
# No reasoning_effort is configured, so caller settings are preserved.
max_tokens = 384000
upstream_model = "deepseek-v4-pro"
protocols = ["chat_completions", "responses"]
rank = 0

[routellm.targets.middle]
provider = "bifrost"
# kimi-k3 (Bifrost Kimi/Modal route): models.dev output cap 131072.
# No reasoning_effort is configured, so caller settings are preserved.
max_tokens = 131072
upstream_model = "kimi-k3"
protocols = ["chat_completions", "responses"]
rank = 1

[routellm.targets.expensive]
provider = "bifrost"
# Claude Opus 5 through Bifrost Bedrock: max output 128k.
# No reasoning_effort is configured, so caller settings are preserved.
max_tokens = 128000
upstream_model = "bedrock/anthropic/claude-opus-5"
protocols = ["chat_completions", "responses"]
rank = 2

[routellm.policies.coding]
complexity_targets = ["cheap", "cheap", "middle", "middle", "expensive"]
invalid_complexity_target = "expensive"


[mantis]
slot_order = [
    "gemini-3_6-flash",
    "gpt-5_6-luna",
    "gpt-5_6-sol",
    "deepseek-v4-flash",
    "claude-opus-5",
    "claude-sonnet-5",
    "gemini-3_1-pro-preview",
]
conductor = "gpt-5_6-luna"
conductor_model = "bifrost/google/gemini-3.5-flash-lite"
trained_slot_contract = "52eac89b5e96f1bf64b2bd83af4d8fbc649ddaaf162f4cabf9504aa93b6ae4cf"

[mantis.workers.gemini-3_6-flash]
provider = "bifrost"
# gemini-3.6-flash (models.dev google-vertex): max output 65536
max_tokens = 65536
upstream_model = "google/gemini-3.6-flash"
model_identity = "gemini-3.6-flash"
reasoning_effort = "high"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-luna]
provider = "bifrost"
# gpt-5.6-luna (models.dev azure/openai): max output 128000
max_tokens = 128000
upstream_model = "gpt-5.6-luna"
model_identity = "gpt-5.6-luna"
reasoning_effort = "xhigh"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-sol]
provider = "bifrost"
# gpt-5.6-sol (models.dev azure/openai): max output 128000
max_tokens = 128000
upstream_model = "gpt-5.6-sol"
model_identity = "gpt-5.6-sol"
reasoning_effort = "medium"
protocols = ["chat_completions"]

[mantis.workers.deepseek-v4-flash]
