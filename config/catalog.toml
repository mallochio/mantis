version = 1

[providers.bifrost]
adapter = "openai-compatible"
base_url = "http://127.0.0.1:8080/v1"
credential_env = "BIFROST_API_KEY"
developer_role = "system"
protocols = ["chat_completions"]

[providers.bifrost-anthropic]
adapter = "anthropic"
base_url = "http://127.0.0.1:8080/anthropic"
credential_env = "BIFROST_API_KEY"
protocols = ["anthropic_messages"]

[routellm]
active_policy = "coding"
revision = "bifrost-2026-08-12"

[routellm.targets.cheap]
provider = "bifrost"
# deepseek-v4-flash (models.dev opencode/deepseek): ctx 1M, max output 384k
max_tokens = 384000
upstream_model = "deepseek-v4-flash"
reasoning_effort = "xhigh"
protocols = ["chat_completions"]
rank = 0

[routellm.targets.middle]
provider = "bifrost"
# gpt-5.6-terra (models.dev azure/openai): ctx 1.05M, max output 128k
max_tokens = 128000
upstream_model = "gpt-5.6-terra"
reasoning_effort = "high"
protocols = ["chat_completions"]
rank = 1

[routellm.targets.expensive]
provider = "bifrost"
# gpt-5.6-sol (models.dev azure/openai): ctx 1.05M, max output 128k
max_tokens = 128000
upstream_model = "gpt-5.6-sol"
reasoning_effort = "medium"
protocols = ["chat_completions"]
rank = 2

[routellm.policies.coding]
complexity_targets = ["cheap", "cheap", "middle", "middle", "expensive"]
invalid_complexity_target = "expensive"


[mantis]
slot_order = [
    "gemini-3_6-flash",
    "gpt-5_6-luna",
    "gpt-5_6-sol",
    "deepseek-v4-flash",
    "claude-opus-5",
    "claude-sonnet-5",
    "gemini-3_1-pro-preview",
]
conductor = "gpt-5_6-luna"
conductor_model = "bifrost/google/gemini-3.5-flash-lite"
trained_slot_contract = "ca34e7ade7e3f4ef86f5180b56bf1689c5f12462d0be69b3eb61ee9b36dbe525"

[mantis.workers.gemini-3_6-flash]
provider = "bifrost"
# gemini-3.6-flash (models.dev google-vertex): max output 65536
max_tokens = 65536
upstream_model = "google/gemini-3.6-flash"
model_identity = "gemini-3.6-flash"
reasoning_effort = "high"
protocols = ["chat_completions"]

