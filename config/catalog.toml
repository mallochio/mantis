version = 1

[providers.bifrost]
adapter = "openai-compatible"
base_url = "http://127.0.0.1:8080/v1"
credential_env = "BIFROST_API_KEY"
developer_role = "system"
protocols = ["chat_completions", "responses"]

[providers.bifrost-anthropic]
adapter = "anthropic"
base_url = "http://127.0.0.1:8080/anthropic"
credential_env = "BIFROST_API_KEY"
protocols = ["anthropic_messages"]

[gateway]
active_policy = "coding"
revision = "bifrost-2026-08-16-flash-effort-opus-sol"

[gateway.targets.cheap]
provider = "bifrost"
# gemini-3.7-flash (models.dev google/google-vertex): max output 65536,
# cost $0.75/$3.75 per 1M in/out.
reasoning_effort = "medium"
force_reasoning_effort = true
max_tokens = 65536
upstream_model = "google/gemini-3.7-flash"
protocols = ["chat_completions", "responses"]
rank = 0

[gateway.targets.middle]
provider = "bifrost"
# claude-opus-5 through Bifrost (vertex-primary, bedrock fallback).
# Cost-monotonic: $5/$25 per 1M in/out — cheaper than gpt-5.6-sol ($5/$30).
# models.dev anthropic/bedrock: max output 128000.
reasoning_effort = "medium"
force_reasoning_effort = true
max_tokens = 128000
upstream_model = "anthropic/claude-opus-5"
protocols = ["chat_completions", "responses"]
rank = 1

[gateway.targets.expensive]
provider = "bifrost"
# gpt-5.6-sol (models.dev azure/openai): max output 128000,
# cost $5/$30 per 1M in/out — the most expensive tier.
reasoning_effort = "high"
force_reasoning_effort = true
max_tokens = 128000
upstream_model = "gpt-5.6-sol"
protocols = ["chat_completions", "responses"]
rank = 2

[gateway.policies.coding]
# 5 operating points: 3 on the cheap model with escalating effort, then
# middle (claude-opus-5) and expensive (gpt-5.6-sol).  Cost-monotonic:
# gemini-flash@low < gemini-flash@medium < gemini-flash@high < opus-5 < sol.
complexity_targets = ["cheap", "cheap", "cheap", "middle", "expensive"]
complexity_efforts = ["low", "medium", "high", "medium", "high"]
invalid_complexity_target = "expensive"


[mantis]
slot_order = [
    "gemini-3_6-flash",
    "gpt-5_6-luna",
    "gpt-5_6-sol",
    "deepseek-v4-flash",
    "claude-opus-5",
    "claude-sonnet-5",
    "gemini-3_1-pro-preview",
]
conductor = "gpt-5_6-luna"
conductor_model = "bifrost/gpt-5.6-luna"
trained_slot_contract = "52eac89b5e96f1bf64b2bd83af4d8fbc649ddaaf162f4cabf9504aa93b6ae4cf"

[mantis.workers.gemini-3_6-flash]
provider = "bifrost"
# gemini-3.7-flash (models.dev google-vertex): max output 65536
max_tokens = 65536
upstream_model = "google/gemini-3.7-flash"
model_identity = "gemini-3.6-flash"
reasoning_effort = "high"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-luna]
provider = "bifrost"
# gpt-5.6-luna (models.dev azure/openai): max output 128000
max_tokens = 128000
upstream_model = "gpt-5.6-luna"
model_identity = "gpt-5.6-luna"
reasoning_effort = "xhigh"
protocols = ["chat_completions"]

[mantis.workers.gpt-5_6-sol]
provider = "bifrost"
# gpt-5.6-sol (models.dev azure/openai): max output 128000
max_tokens = 128000
upstream_model = "gpt-5.6-sol"
model_identity = "gpt-5.6-sol"
reasoning_effort = "medium"
protocols = ["chat_completions"]

[mantis.workers.deepseek-v4-flash]
provider = "bifrost"
# deepseek-v4-flash (models.dev opencode/deepseek): max output 384000
max_tokens = 384000
upstream_model = "deepseek-v4-flash"
model_identity = "deepseek-v4-flash"
protocols = ["chat_completions"]

[mantis.workers.claude-opus-5]
provider = "bifrost-anthropic"
# claude-opus-5 (models.dev bedrock/anthropic): max output 128000
max_tokens = 128000
upstream_model = "bedrock/anthropic/claude-opus-5"
model_identity = "claude-opus-5"
reasoning_effort = "medium"
protocols = ["anthropic_messages"]

[mantis.workers.claude-sonnet-5]
provider = "bifrost-anthropic"
# claude-sonnet-5 (models.dev bedrock/anthropic): max output 128000
max_tokens = 128000
upstream_model = "bedrock/anthropic/claude-sonnet-5"
model_identity = "claude-sonnet-5"
reasoning_effort = "medium"
protocols = ["anthropic_messages"]

[mantis.workers.gemini-3_1-pro-preview]
provider = "bifrost"
# gemini-3.1-pro-preview (models.dev google-vertex): max output 65536
max_tokens = 65536
upstream_model = "google/gemini-3.1-pro-preview"
model_identity = "gemini-3.1-pro-preview"
reasoning_effort = "high"
protocols = ["chat_completions"]

# Fusion lead/sidekick configuration. These are worker slot IDs from [mantis.workers].
[fusion]
main = "gpt-5_6-sol"
sidekick = "gpt-5_6-luna"
max_follow_ups = 10
context_window = 262144
