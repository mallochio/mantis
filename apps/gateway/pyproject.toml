[project]
name = "mantis-gateway"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.0", "httpx==0.28.1", "uvicorn==0.51.0",
  "torch==2.13.0", "transformers==5.13.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "coverage>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
