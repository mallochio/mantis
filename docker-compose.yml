name: mantis

services:
  openfugu:
    build:
      context: .
      dockerfile: docker/openfugu/Dockerfile
    container_name: mantis-orchestrator
    ports: ["8088:8088"]
    environment:
      MANTIS_API_KEY: ${MANTIS_API_KEY:?set MANTIS_API_KEY}
      MANTIS_ENDPOINT_PROFILE: ${MANTIS_ENDPOINT_PROFILE:-direct}
      MANTIS_PROVIDER_BINDINGS: ${MANTIS_PROVIDER_BINDINGS:-}
      MANTIS_WORKER_BINDINGS: ${MANTIS_WORKER_BINDINGS:-}
      MANTIS_PROVIDER_KEYS: ${MANTIS_PROVIDER_KEYS:-}
      MANTIS_IDENTITY_CONTRACT: ${MANTIS_IDENTITY_CONTRACT:-}
      MANTIS_CATALOG_PATH: ${MANTIS_CATALOG_PATH:-}
      AI_ROUTING_CONFIG: ${AI_ROUTING_CONFIG:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_GO_ENDPOINT_URL: ${OPENCODE_GO_ENDPOINT_URL:-https://opencode.ai/zen/go/v1}
      MANTIS_MODEL: ${MANTIS_MODEL:-Qwen/Qwen3-0.6B}
      MANTIS_VECTOR: ${MANTIS_VECTOR:-/app/artifacts/model_iter_60.npy}
      MANTIS_HEAD: ${MANTIS_HEAD:-}
      MANTIS_WORKER_MODEL: ${MANTIS_WORKER_MODEL:-openrouter/anthropic/claude-sonnet-5|medium}
      MANTIS_WORKER_MODELS: ${MANTIS_WORKER_MODELS:-openrouter/google/gemini-3.6-flash|high,openrouter/openai/gpt-5.6-luna|max,openrouter/openai/gpt-5.6-sol|medium,opencode-go/deepseek-v4-flash,openrouter/anthropic/claude-opus-5|medium,openrouter/anthropic/claude-sonnet-5|medium,openrouter/google/gemini-3.1-pro-preview|high}
      MANTIS_LOCAL_MODELS: ${MANTIS_LOCAL_MODELS:-}
      MANTIS_CONDUCTOR_MODEL: ${MANTIS_CONDUCTOR_MODEL:-openrouter/openai/gpt-5.6-luna|max}
      MANTIS_LOCAL_CONDUCTOR: ${MANTIS_LOCAL_CONDUCTOR:-}
      MANTIS_CONDUCTOR_DEVICE: ${MANTIS_CONDUCTOR_DEVICE:-cpu}
      MANTIS_CONDUCTOR_DTYPE: ${MANTIS_CONDUCTOR_DTYPE:-float32}
      MANTIS_CONDUCTOR_MAX_NEW: ${MANTIS_CONDUCTOR_MAX_NEW:-512}
      MANTIS_MAX_TURNS: ${MANTIS_MAX_TURNS:-5}
      MANTIS_MAX_CONCURRENT_REQUESTS: ${MANTIS_MAX_CONCURRENT_REQUESTS:-32}
      MANTIS_SSE_KEEPALIVE_SECONDS: ${MANTIS_SSE_KEEPALIVE_SECONDS:-10}
      MANTIS_STREAM_EVENTS: ${MANTIS_STREAM_EVENTS:-1}
      MANTIS_FINAL_CHUNK_DELAY_MS: ${MANTIS_FINAL_CHUNK_DELAY_MS:-5}
      MANTIS_MAX_BODY_BYTES: ${MANTIS_MAX_BODY_BYTES:-5242880}
      MANTIS_RUN_STORE: ${MANTIS_RUN_STORE:-memory}
      MANTIS_REDIS_URL: ${MANTIS_REDIS_URL:-redis://redis:6379/0}
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_VISIBLE_DEVICES: ""
      TOKENIZERS_PARALLELISM: "false"
      MANTIS_LEARNING: ${MANTIS_LEARNING:-0}
      MANTIS_LEARNING_DIR: /app/learning
      MANTIS_LEARNING_MIN_RUNS: ${MANTIS_LEARNING_MIN_RUNS:-50}
      MANTIS_LEARNING_MIN_IMPROVEMENT: ${MANTIS_LEARNING_MIN_IMPROVEMENT:-0.02}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ${MANTIS_LEARNING_HOST_DIR:-${HOME}/.local/share/mantis/learning}:/app/learning
      # The shared catalog is mounted read-only at its standard location so the
      # entrypoint can validate it before start. In direct mode the mount is
      # inert; the catalog profile fails closed when the file is missing.
      - ${MANTIS_CATALOG_PATH:-${HOME}/.config/ai-routing/catalog.toml}:/app/catalog/catalog.toml:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [mantis]

  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mantis-redis:/data
    networks: [mantis]

networks:
  mantis:
    driver: bridge

volumes:
  hf-cache:
    external: true
    name: mantis_hf-cache
  mantis-redis:
