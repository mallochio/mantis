services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: fugu-litellm
    ports: ["3001:4000"]
    volumes:
      - ./configs/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_KEY: ${LITELLM_KEY:-sk-fugu-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [fugu]

  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    container_name: fugu-router
    ports: ["5500:5500"]
    environment:
      LITELLM_BASE: http://litellm:4000/v1
      LITELLM_KEY: ${LITELLM_KEY:-sk-fugu-local}
      ROUTELLM_KEY: ${LITELLM_KEY:-sk-fugu-local}
      # llm-router's mf scorer still needs an OpenAI key for text-embedding-3-small.
      # The backend LLM calls go through the LiteLLM proxy / OpenRouter.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXPENSIVE_MODEL: ${EXPENSIVE_MODEL:-claude-opus-4.8}
      CHEAP_MODEL: ${CHEAP_MODEL:-claude-sonnet-5}
      EXPENSIVE_REASONING_EFFORT: ""
      CHEAP_REASONING_EFFORT: ""
      ROUTELLM_USE_SUPRA: "1"
    depends_on:
      litellm:
        condition: service_healthy
    networks: [fugu]

  openfugu:
    build:
      context: .
      dockerfile: openfugu/Dockerfile
    container_name: fugu-orchestrator
    ports: ["8088:8088"]
    environment:
      FUGU_BASE_URL: http://litellm:4000/v1
      FUGU_API_KEY: ${LITELLM_KEY:-sk-fugu-local}
      FUGU_MODEL: ${FUGU_MODEL:-Qwen/Qwen3-0.6B}
      FUGU_VECTOR: ${FUGU_VECTOR:-/app/artifacts/model_iter_60.npy}
      FUGU_HEAD: ${FUGU_HEAD:-}
      FUGU_WORKER_MODEL: ${FUGU_WORKER_MODEL:-claude-sonnet-5}
      FUGU_WORKER_MODELS: ${FUGU_WORKER_MODELS:-${FUGU_WORKER_MODEL:-claude-sonnet-5}}
      FUGU_LOCAL_MODELS: ${FUGU_LOCAL_MODELS:-}
      FUGU_CONDUCTOR_MODEL: ${FUGU_CONDUCTOR_MODEL:-claude-opus-4.8}
      FUGU_LOCAL_CONDUCTOR: ${FUGU_LOCAL_CONDUCTOR:-}
      FUGU_CONDUCTOR_DEVICE: ${FUGU_CONDUCTOR_DEVICE:-cpu}
      FUGU_CONDUCTOR_DTYPE: ${FUGU_CONDUCTOR_DTYPE:-float32}
      FUGU_CONDUCTOR_MAX_NEW: ${FUGU_CONDUCTOR_MAX_NEW:-512}
      FUGU_MAX_TURNS: ${FUGU_MAX_TURNS:-5}
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_VISIBLE_DEVICES: ""   # CPU on Mac
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./artifacts:/app/artifacts:ro
    depends_on:
      litellm:
        condition: service_healthy
    networks: [fugu]

networks:
  fugu:
    driver: bridge

volumes:
  hf-cache:
