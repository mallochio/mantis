name: mantis

services:
  openfugu:
    build:
      context: .
      dockerfile: docker/openfugu/Dockerfile
    container_name: mantis-orchestrator
    ports: ["8088:8088"]
    environment:
      MANTIS_API_KEY: ${MANTIS_API_KEY:?set MANTIS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      MANTIS_MODEL: ${MANTIS_MODEL:-Qwen/Qwen3-0.6B}
      MANTIS_VECTOR: ${MANTIS_VECTOR:-/app/artifacts/model_iter_60.npy}
      MANTIS_HEAD: ${MANTIS_HEAD:-}
      MANTIS_WORKER_MODEL: ${MANTIS_WORKER_MODEL:-openrouter/anthropic/claude-sonnet-5|medium}
      MANTIS_WORKER_MODELS: ${MANTIS_WORKER_MODELS:-openrouter/google/gemini-3.6-flash|high,openrouter/openai/gpt-5.6-luna|max,openrouter/openai/gpt-5.6-sol|medium,opencode-go/deepseek-v4-flash,openrouter/anthropic/claude-opus-5|medium,openrouter/anthropic/claude-sonnet-5|medium,openrouter/google/gemini-3.1-pro-preview|high}
      MANTIS_LOCAL_MODELS: ${MANTIS_LOCAL_MODELS:-}
      MANTIS_CONDUCTOR_MODEL: ${MANTIS_CONDUCTOR_MODEL:-openrouter/openai/gpt-5.6-luna|max}
      MANTIS_LOCAL_CONDUCTOR: ${MANTIS_LOCAL_CONDUCTOR:-}
      MANTIS_CONDUCTOR_DEVICE: ${MANTIS_CONDUCTOR_DEVICE:-cpu}
      MANTIS_CONDUCTOR_DTYPE: ${MANTIS_CONDUCTOR_DTYPE:-float32}
      MANTIS_CONDUCTOR_MAX_NEW: ${MANTIS_CONDUCTOR_MAX_NEW:-512}
      MANTIS_MAX_TURNS: ${MANTIS_MAX_TURNS:-5}
      MANTIS_MAX_CONCURRENT_REQUESTS: ${MANTIS_MAX_CONCURRENT_REQUESTS:-32}
      MANTIS_SSE_KEEPALIVE_SECONDS: ${MANTIS_SSE_KEEPALIVE_SECONDS:-10}
      MANTIS_MAX_BODY_BYTES: ${MANTIS_MAX_BODY_BYTES:-5242880}
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_VISIBLE_DEVICES: ""
      TOKENIZERS_PARALLELISM: "false"
      MANTIS_LEARNING: ${MANTIS_LEARNING:-0}
      MANTIS_LEARNING_DIR: /app/learning
      MANTIS_LEARNING_MIN_RUNS: ${MANTIS_LEARNING_MIN_RUNS:-50}
      MANTIS_LEARNING_MIN_IMPROVEMENT: ${MANTIS_LEARNING_MIN_IMPROVEMENT:-0.02}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ${MANTIS_LEARNING_HOST_DIR:-${HOME}/.local/share/mantis/learning}:/app/learning
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [mantis]

networks:
  mantis:
    driver: bridge

volumes:
  hf-cache:
    external: true
    name: mantis_hf-cache
